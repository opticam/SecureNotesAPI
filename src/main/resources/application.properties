quarkus.application.name=secure-notes-api
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:securenotes}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:securenotes}

quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

mp.jwt.verify.publickey.location=${MP_JWT_VERIFY_PUBLICKEY_LOCATION:secrets/publicKey.pem}
mp.jwt.verify.issuer=${SECURENOTES_JWT_ISSUER:secure-notes-api}
smallrye.jwt.sign.key.location=${SMALLRYE_JWT_SIGN_KEY_LOCATION:secrets/privateKey.pem}
securenotes.jwt.issuer=${SECURENOTES_JWT_ISSUER:secure-notes-api}
securenotes.jwt.duration-seconds=${SECURENOTES_JWT_DURATION_SECONDS:3600}

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=SecureNotesAPI
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Authenticated API for creating, managing, and sharing secure notes.

%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.clean-at-start=true
