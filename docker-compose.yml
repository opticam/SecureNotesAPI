services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securenotes
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securenotes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenotes -d securenotes"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/securenotes
      QUARKUS_DATASOURCE_USERNAME: securenotes
      QUARKUS_DATASOURCE_PASSWORD: securenotes
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: privateKey.pem
      SECURENOTES_JWT_ISSUER: secure-notes-api
    ports:
      - "8080:8080"

volumes:
  postgres-data:
