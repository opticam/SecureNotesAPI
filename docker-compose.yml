services:
  jwt-keygen:
    image: node:24-alpine
    working_dir: /keys
    command:
      - node
      - -e
      - |
        const fs = require('fs');
        const crypto = require('crypto');
        const privateKeyPath = '/keys/privateKey.pem';
        const publicKeyPath = '/keys/publicKey.pem';
        if (fs.existsSync(privateKeyPath) && fs.existsSync(publicKeyPath)) {
          console.log('JWT development keys already exist.');
          process.exit(0);
        }
        const { publicKey, privateKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
        fs.writeFileSync(privateKeyPath, privateKey.export({ type: 'pkcs8', format: 'pem' }));
        fs.writeFileSync(publicKeyPath, publicKey.export({ type: 'spki', format: 'pem' }));
        console.log('Generated JWT development keys in ./secrets.');
    volumes:
      - ./secrets:/keys

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: securenotes
      POSTGRES_USER: securenotes
      POSTGRES_PASSWORD: securenotes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securenotes -d securenotes"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      jwt-keygen:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/securenotes
      QUARKUS_DATASOURCE_USERNAME: securenotes
      QUARKUS_DATASOURCE_PASSWORD: securenotes
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: /run/secrets/securenotes/publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: /run/secrets/securenotes/privateKey.pem
      SECURENOTES_JWT_ISSUER: secure-notes-api
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/run/secrets/securenotes:ro

volumes:
  postgres-data:
